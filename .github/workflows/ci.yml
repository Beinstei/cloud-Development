name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          pwd
          ls -la
          ls -la ** || true

      - name: Check HTML exists anywhere
        run: |
          python3 - << 'PY'
          import glob, sys
          files = glob.glob("**/*.html", recursive=True)
          print("HTML files found:", files)
          if not files:
            print("ERROR: No HTML files found in repository.")
            sys.exit(1)
          PY
