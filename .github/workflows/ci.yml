name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node (for tooling)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Basic project checks
        run: |
          echo "Repo files:"
          ls -la
          test -f index.html
          test -f JS/app.js
          echo "✅ Required files exist"

      # OPTIONAL (recommended): Install and run linters if you add package.json
      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found — skipping npm ci"
          fi

      - name: Run lint/tests (if defined)
        run: |
          if [ -f package.json ]; then
            npm test --if-present
            npm run lint --if-present
          else
            echo "No tests/lint configured — CI completed with basic checks"
          fi
